name: CI

# Correctness only. Latency and throughput benchmarks are deliberately absent
# and will stay absent: a shared GitHub runner is a noisy, oversubscribed,
# virtualised host, and numbers measured there would be wrong rather than merely
# imprecise. Publishing them would discredit the honest ones. See CLAIMS.md.

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The committed build config sets target-cpu=native, which is right for a
  # measured run on a known host and wrong for a CI runner whose CPU varies.
  RUSTFLAGS: ""

jobs:
  generated-is-current:
    name: Generated files match the schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustfmt formats the generated Rust, so the check needs it present.
          components: rustfmt
      - name: Regenerate and diff
        run: make check-generated
      - name: Show what drifted
        if: failure()
        run: |
          echo "::error::A generated file does not match schema/market-data.xml."
          echo "Run 'make generate' locally and commit the result."
          make generate
          git --no-pager diff --stat

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Release, because the redundancy tests push 10M messages through the
      # arbitrator twice and a debug build turns seconds into minutes.
      #
      # BOOK_DIFF_OPS raises the differential test from its `cargo test` default
      # of 300k. Five million operations through both books takes about fifteen
      # seconds optimised, and it is the strongest evidence in this repo that the
      # fast book is correct: the bug it has already caught took 118,000
      # operations to appear.
      - run: cargo test --workspace --release
        env:
          BOOK_DIFF_OPS: 5000000
      - run: cargo test --workspace

  # arm64 is free for public repositories, and it is the only free host that
  # meets this project's four-physical-core requirement -- server ARM has no
  # SMT, so 4 vCPU is 4 real cores. That makes it the likeliest place milestone
  # 6 is ever measured, so the ARM code path is compiled and tested on every
  # push rather than discovered to be broken on the day it matters.
  #
  # The cycle counter is `cntvct_el0` there rather than `rdtsc`; see
  # crates/bench-support/src/tsc.rs for why the x86 invariance flags do not
  # apply and what replaces them.
  rust-arm64:
    name: Rust on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Not a benchmark -- benchmarks never run in CI. This only asks the host
      # gate what it thinks of a free arm64 runner, which is the question the
      # zero-budget plan turns on.
      - name: What does the host gate say about a free arm64 runner?
        run: cargo run --release -p bench --bin hostcheck || true

  cpp:
    name: C++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both compilers, because struct layout and integer-promotion warnings
        # are exactly where the two toolchains quietly disagree.
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build cpp/build
      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure

  smoke:
    name: Engine and handler reconcile over real sockets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two processes, real UDP sockets, both transports. The assertion is that
      # the handler's book matches the engine's own at the same sequence number.
      # Shorter than the local default because a CI runner is not where anything
      # gets measured — this is a correctness check, not a benchmark.
      - name: Smoke test
        run: scripts/smoke.sh --messages 50000
      - name: Keep the artifacts when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: results/smoke/
          retention-days: 7

  cross-language:
    name: Both codecs agree, and a corrupt vector fails both
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the C++ golden test
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build cpp/build
      - name: A one-byte edit must fail both suites
        run: make test-corruption
