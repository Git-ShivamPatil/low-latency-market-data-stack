[package]
name = "bench"
description = "Microbenchmarks, the in-path timing harness, and the host gate (milestone 6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bench-support = { path = "../crates/bench-support" }
book = { path = "../crates/book" }
wire = { path = "../crates/wire" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "hostcheck"
path = "src/bin/hostcheck.rs"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "book_update"
harness = false
