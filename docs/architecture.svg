<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Low-latency market data and order entry stack — five processes, four shared-memory rings, one multicast feed</title>
  <desc id="d">A FIX client connects to the C++ fix-gateway. The gateway forwards orders to the C++ risk-service over the orders ring; risk forwards accepted orders to the Rust matching-engine over the accepted ring. Execution reports return over the execs ring to risk and the reports ring to the gateway, and leave as FIX execution reports. The engine also publishes a binary feed on two redundant multicast channels, A and B. The Rust feed-handler arbitrates the two and rebuilds the books; the Rust replay-service stores the same feed and serves exact sequence ranges back to the handler over TCP when a gap cannot be closed from the other arm.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#787878"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ============ FIX client ============ -->
    <rect x="30" y="34" width="190" height="46" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="125" y="55" text-anchor="middle" font-size="13" fill="#929292">FIX client</text>
    <text x="125" y="71" text-anchor="middle" font-size="10.5" fill="#7a7a7a">not part of this repository</text>

    <!-- client -> gateway -->
    <line x1="96" y1="80" x2="96" y2="150" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <!-- gateway -> client -->
    <line x1="154" y1="150" x2="154" y2="80" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="236" y="105" text-anchor="start" font-size="10.5" fill="#7a7a7a">35=D  NewOrderSingle</text>
    <text x="236" y="120" text-anchor="start" font-size="10.5" fill="#7a7a7a">35=F  OrderCancelRequest</text>
    <text x="236" y="140" text-anchor="start" font-size="10.5" fill="#7a7a7a">35=8  ExecutionReport</text>

    <!-- ============ order path row ============ -->
    <!-- gateway -->
    <rect x="30" y="150" width="190" height="92" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="125" y="176" text-anchor="middle" font-size="13.5" fill="#9a9a9a">fix-gateway</text>
    <text x="125" y="194" text-anchor="middle" font-size="10.5" fill="#7a7a7a">C++20</text>
    <text x="125" y="212" text-anchor="middle" font-size="10.5" fill="#7a7a7a">session · resend · gap-fill</text>
    <text x="125" y="229" text-anchor="middle" font-size="10.5" fill="#7a7a7a">durable seqnums · order WAL</text>

    <!-- risk -->
    <rect x="340" y="150" width="190" height="92" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="435" y="176" text-anchor="middle" font-size="13.5" fill="#9a9a9a">risk-service</text>
    <text x="435" y="194" text-anchor="middle" font-size="10.5" fill="#7a7a7a">C++20</text>
    <text x="435" y="212" text-anchor="middle" font-size="10.5" fill="#7a7a7a">pre-trade limits</text>
    <text x="435" y="229" text-anchor="middle" font-size="10.5" fill="#7a7a7a">no allocation after startup</text>

    <!-- engine -->
    <rect x="650" y="150" width="190" height="92" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="745" y="176" text-anchor="middle" font-size="13.5" fill="#9a9a9a">matching-engine</text>
    <text x="745" y="194" text-anchor="middle" font-size="10.5" fill="#7a7a7a">Rust</text>
    <text x="745" y="212" text-anchor="middle" font-size="10.5" fill="#7a7a7a">price-time priority</text>
    <text x="745" y="229" text-anchor="middle" font-size="10.5" fill="#7a7a7a">publishes the feed</text>

    <!-- rings forward -->
    <line x1="220" y1="178" x2="340" y2="178" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="280" y="171" text-anchor="middle" font-size="10.5" fill="#8f8f8f">orders</text>
    <line x1="530" y1="178" x2="650" y2="178" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="590" y="171" text-anchor="middle" font-size="10.5" fill="#8f8f8f">accepted</text>

    <!-- rings back -->
    <line x1="340" y1="214" x2="220" y2="214" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="280" y="232" text-anchor="middle" font-size="10.5" fill="#8f8f8f">reports</text>
    <line x1="650" y1="214" x2="530" y2="214" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="590" y="232" text-anchor="middle" font-size="10.5" fill="#8f8f8f">execs</text>

    <!-- ring annotation -->
    <line x1="220" y1="264" x2="650" y2="264" stroke="#787878" stroke-width="0.8" stroke-dasharray="2 4"/>
    <text x="435" y="281" text-anchor="middle" font-size="10.5" fill="#7a7a7a">four SPSC rings, each a file mmap'd by exactly two processes · layouts generated from the schema</text>

    <!-- ============ engine -> feed ============ -->
    <line x1="745" y1="242" x2="745" y2="336" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <text x="757" y="312" text-anchor="start" font-size="10.5" fill="#7a7a7a">batched, 32 msg/datagram</text>

    <!-- ============ the A/B bus ============ -->
    <line x1="120" y1="344" x2="900" y2="344" stroke="#8a8a8a" stroke-width="1.2"/>
    <line x1="120" y1="360" x2="900" y2="360" stroke="#8a8a8a" stroke-width="1.2"/>
    <text x="112" y="348" text-anchor="end" font-size="11" fill="#8f8f8f">A</text>
    <text x="112" y="364" text-anchor="end" font-size="11" fill="#8f8f8f">B</text>
    <text x="908" y="356" text-anchor="start" font-size="10.5" fill="#7a7a7a">UDP</text>
    <text x="445" y="332" text-anchor="middle" font-size="11" fill="#929292">two redundant multicast channels carrying the same stream</text>

    <!-- bus -> handler -->
    <line x1="745" y1="360" x2="745" y2="424" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>
    <!-- bus -> replay -->
    <line x1="245" y1="360" x2="245" y2="424" stroke="#8a8a8a" stroke-width="1" marker-end="url(#a)"/>

    <!-- ============ consumer row ============ -->
    <!-- feed handler -->
    <rect x="650" y="424" width="190" height="92" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="745" y="450" text-anchor="middle" font-size="13.5" fill="#9a9a9a">feed-handler</text>
    <text x="745" y="468" text-anchor="middle" font-size="10.5" fill="#7a7a7a">Rust</text>
    <text x="745" y="486" text-anchor="middle" font-size="10.5" fill="#7a7a7a">A/B arbitration · gap detection</text>
    <text x="745" y="503" text-anchor="middle" font-size="10.5" fill="#7a7a7a">MBO + MBP books, zero alloc</text>

    <!-- replay -->
    <rect x="150" y="424" width="190" height="92" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="245" y="450" text-anchor="middle" font-size="13.5" fill="#9a9a9a">replay-service</text>
    <text x="245" y="468" text-anchor="middle" font-size="10.5" fill="#7a7a7a">Rust</text>
    <text x="245" y="486" text-anchor="middle" font-size="10.5" fill="#7a7a7a">stores the stream</text>
    <text x="245" y="503" text-anchor="middle" font-size="10.5" fill="#7a7a7a">serves exact ranges</text>

    <!-- handler <-> replay -->
    <line x1="650" y1="458" x2="340" y2="458" stroke="#787878" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ad)"/>
    <text x="495" y="451" text-anchor="middle" font-size="10.5" fill="#7a7a7a">replay request — the range it lost on both arms</text>
    <line x1="340" y1="486" x2="650" y2="486" stroke="#787878" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ad)"/>
    <text x="495" y="503" text-anchor="middle" font-size="10.5" fill="#7a7a7a">exactly that range, over TCP</text>

    <!-- footer note -->
    <text x="480" y="542" text-anchor="middle" font-size="10.5" fill="#6f6f6f">The engine also publishes a snapshot cycle every 2s on the same channels; the handler recovers from whichever arrives first.</text>

  </g>
</svg>
